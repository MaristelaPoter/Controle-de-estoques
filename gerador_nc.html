<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de apresentação de NC</title>
<style>
:root{--ink:#181D1A;--ink-muted:#5C6660;--ink-faint:#8B948E;--paper:#F6F7F4;--surface:#FFFFFF;--line:#E4E7E1;--line-strong:#CBD2CA;--brand:#0F5C3A;--brand-deep:#0A3323;--brand-soft:#E7F1EC;--mono:ui-monospace,"SFMono-Regular",Consolas,monospace;--radius-sm:7px;--radius-md:10px;
--bg:var(--paper);--fg:var(--ink);--mut:var(--ink-muted);--card:var(--surface);--acc:var(--brand)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
body{font-size:14px}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside.sidebar{background:var(--brand-deep);display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;z-index:60}
.brandmark{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:18px}
.brandmark .dot{width:8px;height:8px;border-radius:50%;background:#6FCF9A;flex:none;box-shadow:0 0 0 3px rgba(111,207,154,.18)}
.brandmark .names{line-height:1.3}
.brandmark .names b{font-size:14.5px;font-weight:700;letter-spacing:-.01em;display:block;color:#fff}
.brandmark .names span{font-size:11px;color:#8FC1A6}
.sidebar .grow{flex:1}
.app-switcher{border-top:1px solid rgba(255,255,255,.12);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:2px}
.app-switcher-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#7FB99B;padding:4px 12px 7px;font-weight:700}
.app-switcher-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);color:#A9CFBB;font-size:13px;font-weight:500;text-decoration:none;transition:background .12s ease,color .12s ease}
.app-switcher-link svg{width:16px;height:16px;flex:none;opacity:.8}
.app-switcher-link:hover{background:rgba(255,255,255,.07);color:#fff}
.app-switcher-link.current{background:rgba(255,255,255,.13);color:#fff;font-weight:600;box-shadow:inset 2.5px 0 0 #6FCF9A;cursor:default;pointer-events:none}
.app-switcher-link.current svg{opacity:1}
.content{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 32px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.context{display:flex;flex-direction:column;gap:3px}
.context .file{font-size:18px;font-weight:700;letter-spacing:-.015em}
.context .period{font-size:12px;color:var(--ink-faint);font-weight:500}
main{width:100%;max-width:1100px;padding:28px 32px 60px;display:flex;flex-direction:column;gap:16px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px;border:1.5px dashed var(--line-strong);border-radius:14px;background:var(--surface);cursor:pointer;text-align:center;transition:border-color .15s ease,background .15s ease}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop b{font-size:14px}.drop span{font-size:12.5px;color:var(--mut)}
.drop input{display:none}
.msg{font-size:13px;color:var(--mut)}.msg.err{color:#B8471E}
.panel{display:none;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);flex:1 1 180px}
.panel input,.panel select{font:inherit;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;padding:9px 10px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);width:100%}
.panel input:focus,.panel select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
button{font-family:inherit;font-size:13px;padding:10px 16px;border:0;border-radius:var(--radius-sm);background:var(--brand);color:#fff;font-weight:600;cursor:pointer;transition:.12s ease}
button:hover{background:var(--brand-deep)}
#stage{width:100%;position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--line);display:none}
#slide{width:1920px;height:1080px;position:absolute;left:0;top:0;transform-origin:0 0;background:#f4f1ea;font-family:'Helvetica Neue',Arial,sans-serif}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.ghost:hover{background:var(--paper)}
.user{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-muted)}
.pending .shell{visibility:hidden}
#boot{display:none;position:fixed;inset:0;align-items:center;justify-content:center;color:var(--ink-muted);font-size:14px}
.pending #boot{display:flex}
#loginScreen{display:none;position:fixed;inset:0;z-index:300;background:var(--paper);align-items:center;justify-content:center;padding:20px}
.loginbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 28px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:14px}
.loginbox h2{margin:0;font-size:16px}.loginbox p{margin:0;font-size:12.5px;color:var(--ink-muted)}
.loginbox label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-muted)}
.loginbox input{font:inherit;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;padding:10px;border:1px solid var(--line-strong);border-radius:var(--radius-sm)}
.loginbox input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
#loginError{font-size:12.5px;color:#B8471E}
@page{size:1920px 1080px;margin:0}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside.sidebar{position:static;height:auto;flex-direction:row;align-items:center;padding:12px 16px;overflow-x:auto}.brandmark{border-bottom:none;padding:0 12px 0 0;margin:0;border-right:1px solid rgba(255,255,255,.14)}.sidebar .grow{display:none}.app-switcher{flex-direction:row;border-top:none;border-left:1px solid rgba(255,255,255,.14);margin:0 0 0 10px;padding:0 0 0 10px}.app-switcher-label{display:none}.app-switcher-link{white-space:nowrap}.topbar{padding:12px 16px}main{padding:18px 16px 40px}}

<script>
const $=id=>document.getElementById(id);

 return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN}

function fmtQS(s){s=String(s||'').trim();if(s.split('(').length>s.split(')').length)s=s.slice(0,s.lastIndexOf('(')).trim();const m=/^(Q\s*\d+)\s*[-–—:]\s*(.*)$/i.exec(s);

 const out=[];
 if(h>=0){const n=rows[h].map(norm),f=fn=>n.findIndex(fn);
  const ix={code:f(x=>x.startsWith('cod')&&x.includes('prod')),prod:f(x=>x==='produto'||x.startsWith('descricao')),qty:f(x=>/^(qtde|qtd|quantidade)\b/.test(x)),
   price:f(x=>/(valor unit|vl unit|preco)/.test(x)),qs:f(x=>x==='q s'||x==='qs'),date:f(x=>x.startsWith('data')&&/\bn c\b|\bnc\b/.test(x)),origin:f(x=>x.includes('origem')),

  if(ix.date<0)ix.date=f(x=>x.startsWith('data'));

  for(const r of rows.slice(h+1)){let code=String(r[ix.code]??'').trim();if(!code)continue;if(/^\d{8,9}$/.test(code))code=code.padStart(10,'0');
   out.push({code,prod:String(r[ix.prod]??'').trim(),qty:num(r[ix.qty])||0,price:num(r[ix.price])||0,qs:ix.qs>=0?String(r[ix.qs]).trim():'',
    date:ix.date>=0?toDate(r[ix.date]):null,origin:ix.origin>=0?String(r[ix.origin]).trim():'',obs:ix.obs>=0?String(r[ix.obs]).trim():'',unit:ix.unit>=0?String(r[ix.unit]).trim():''})}
 }else{
  for(const r of rows){const s=r.map(c=>String(c??'').trim());const ci=s.findIndex(c=>/^\d{9,10}$/.test(c));if(ci<0)continue;
   const ui=s.findIndex(c=>/^(MT|UN|UND|PC|PCS|PÇ|KG|M|CX|L|M2|JG|CJ|PAR)$/i.test(c)),qi=s.findIndex(c=>/^Q\s*\d+\s*[-–—]/i.test(c)),di=r.findIndex(c=>toDate(c)!==null);
   let qty=0,price=0;
   if(ui>0){qty=num(r[ui-1]);price=num(r[ui+1])}else{const ns=r.map((c,i)=>i<ci&&i!==di&&(typeof c==='number'||/^[\d.,]+$/.test(s[i]))?num(c):NaN).filter(x=>!isNaN(x));qty=ns[0];price=ns[1]}
   let obs='';if(qi>=0)for(let i=s.length-1;i>qi;i--)if(s[i]&&isNaN(num(s[i]))){obs=s[i];break}
   out.push({code:s[ci].padStart(10,'0'),prod:s[ci+1],qty:qty||0,price:price||0,qs:qi>=0?s[qi]:'',date:di>=0?toDate(r[di]):null,
    origin:di>=0&&typeof r[di+1]==='string'?s[di+1]:'',obs,unit:ui>=0?s[ui]:''})}

let DATA=[],FILE='',S=null,CAT={},CATSTATE='aguardando',CATMSG='';
const codeKeys=c=>{c=String(c||'').trim().toLowerCase();return [c,c.replace(/^0+/,'')]};

 const k=codeKeys(r.code),c=CAT[k[0]]||CAT[k[1]];if(c){r.price=c;r.src='painel';n++}else{r.price=0;r.src='nenhum';miss++}}return{n,miss}}
window.setCatalogo=(map,state,msg)=>{CAT=map||{};CATSTATE=state;CATMSG=msg||'';if(DATA.length){applyCatalog();analyze();render()}};
function priceNote(){if(!S)return;const t={arquivo:'Valor unitário lido do DataGrid.',painel:'Valor unitário vindo do painel de estoques (último valor registrado).',misto:'Valor unitário: parte do DataGrid, parte do painel de estoques.',parcial:'Alguns registros do item ficaram sem valor — confira o valor unitário.',nenhum:'Valor unitário não encontrado no DataGrid nem no painel — preencha no campo ao lado.'};
 let s=S.manual?'Valor unitário digitado manualmente.':t[S.src];if(CATSTATE==='erro'&&S.src!=='arquivo'&&!S.manual)s+=' (Não foi possível ler os valores do painel: '+CATMSG+'.)';
 if(CATSTATE==='aguardando'&&S.src!=='arquivo'&&!S.manual)s+=' Aguardando o painel responder…';$('priceNote').textContent=s}
function analyze(){
 const m={};for(const r of DATA){const g=m[r.code]??=(r.k={code:r.code,prod:r.prod,qty:0,val:0,n:0,rows:[]},r.k);g.qty+=r.qty;g.val+=r.qty*r.price;g.n++;g.rows.push(r)}
 const key=$('crit').value,list=Object.values(m).sort((a,b)=>b[key]-a[key]||b.n-a.n);
 const it=list[0];if(!it){S=null;return}
 const mode=a=>{const c={};a.filter(Boolean).forEach(x=>c[x]=(c[x]||0)+1);return Object.keys(c).sort((x,y)=>c[y]-c[x])[0]||''};
 const rs={};for(const r of it.rows){const k=fmtQS(r.qs),g=rs[k]??={name:k,qty:0,val:0,obs:{}};g.qty+=r.qty;g.val+=r.qty*r.price;if(r.obs){const o=cap(r.obs);g.obs[o]=(g.obs[o]||0)+1}}
 const dates=it.rows.map(r=>r.date).filter(x=>x!=null);
 S={code:it.code,prod:it.prod,n:it.n,fileQty:it.qty,qty:it.qty,price:it.qty?it.val/it.qty:0,origin:nice(mode(it.rows.map(r=>r.origin))),unit:mode(it.rows.map(r=>r.unit)).toUpperCase(),
  reasons:Object.values(rs).sort((a,b)=>b.qty-a.qty).slice(0,4),dmin:dates.length?Math.min(...dates):null,dmax:dates.length?Math.max(...dates):null};
 const ss=new Set(it.rows.map(r=>r.src));S.src=ss.has('nenhum')?(ss.size>1?'parcial':'nenhum'):(ss.has('painel')?(ss.has('arquivo')?'misto':'painel'):'arquivo');
 $('fOrigin').value=S.origin;$('fQty').value=String(S.qty).replace('.',',');$('fPrice').value=String(+S.price.toFixed(4)).replace('.',',')}
function model(){
 const u=!S.unit||S.unit==='UN'||S.unit==='UND'?'un':S.unit,total=S.qty*S.price,sc=S.fileQty?S.qty/S.fileQty:1,multi=S.reasons.length>1;
 const dt=S.dmin==null?'':' · NC de '+(S.dmin===S.dmax?fmtDate(S.dmin):fmtDate(S.dmin)+' a '+fmtDate(S.dmax));
 const M=[],T=(x,y,w,h,s,size,bold,color,nw)=>M.push({t:'t',x,y,w,h,s,size,bold,color,nw}),R=(x,y,w,h,fill,line,r)=>M.push({t:'r',x,y,w,h,fill,line,r});
 const title='Item com mais NC'+(S.origin?' · '+S.origin:'');
 T(128,110,1664,80,title,title.length>44?52:64,1,'17202A');
 T(128,215,1664,36,'Cód. '+S.code,28,0,'6A6559',1);
 T(128,258,1664,110,S.prod,40,1,'17202A');
 const cw=(1664-64)/3,ky=395,kh=170,vu=money(S.price)+(u==='un'?'':' / '+u);
 [['Quantidade com NC',nf(S.qty,0)+' '+u,'17202A',null,'F4F1EA','C9C5BB',0],['Valor unitário',vu,'FFFFFF','DDD8CC','17202A','6A6559',0],['Valor total',money(total),'E07A1F',null,'17202A','17202A',1]].forEach((k,i)=>{
  const x=128+i*(cw+32);R(x,ky,cw,kh,k[2],k[3],16);T(x+36,ky+28,cw-72,34,k[0],26,k[6],k[5],1);T(x+36,ky+84,cw-72,76,k[1],k[1].length>12?48:60,1,k[4],1)});

 S.reasons.forEach((r,i)=>{const full=n===1||(i===n-1&&n%2===1),w=full?1664:816,x=full?128:128+(i%2)*848;
  if(i%2===0&&i>0){ry+=rowH+28;rowH=0}
  const o=Object.keys(r.obs).sort((a,b)=>r.obs[b]-r.obs[a]).slice(0,2).join('; ').slice(0,110),tt=r.name+(multi?' · '+nf(r.qty*sc,0)+' '+u+' · '+money(r.val*sc):'');
  const tl=Math.min(2,Math.ceil(tt.length/((w-36)/18.5))),sl=o?Math.min(2,Math.ceil(o.length/((w-36)/15.5))):0,th=tl*37,bh=4+th+(o?8+sl*34:0)+4;
  R(x,ry,8,bh,i%2?'17202A':'E07A1F');

  if(o)T(x+36,ry+4+th+8,w-36,sl*34,o,28,0,'4A463E');

 T(128,990,1664,32,'Fonte: '+FILE+' · '+S.n+' registro'+(S.n>1?'s':'')+' · '+nf(S.qty,0)+' '+u+' × '+money(S.price),24,0,'6A6559',1);
 return M}
function render(){
